version: '3.8'

services:
  gestro-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./frozen_inference_graphs:/app/frozen_inference_graphs
      - ./api:/app/api
    environment:
      - PYTHONUNBUFFERED=1
    devices:
      - /dev/video0:/dev/video0
    restart: unless-stopped

  gestro-dashboard:
    image: node:16-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    restart: unless-stopped

networks:
  default:
    name: gestro-network
